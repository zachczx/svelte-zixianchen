name: CI

on:
  push:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  workflow_dispatch:

permissions:
  contents: read

# Keep lightweight policy-only runs separate from full CI so branch pushes and
# PR title/body edits do not cancel an in-progress build for the same pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'policy-edit' || 'build' }}
  cancel-in-progress: true

jobs:
  commit-policy:
    name: Commit policy
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate commit subjects and pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          prefix_pattern='^(feat|fix|refactor|chore|docs|test|perf|style|build|ci|revert)!?$'

          validate_subject() {
            local subject="$1"
            local source="$2"
            local body="${3-}"

            if [[ "$subject" != *": "* ]]; then
              echo "::error::$source must use Conventional Commit format: <type>: <summary>"
              echo "  $subject"
              return 1
            fi

            local prefix="${subject%%:*}"
            local summary="${subject#*: }"

            if [[ ! "$prefix" =~ $prefix_pattern ]]; then
              echo "::error::$source has an invalid Conventional Commit prefix: '$prefix'"
              echo "Scopes are not used in this repository."
              echo "Allowed types: feat, fix, refactor, chore, docs, test, perf, style, build, ci, revert."
              return 1
            fi

            if [[ -z "$summary" ]]; then
              echo "::error::$source must include a summary after ': '."
              return 1
            fi

            local type="${prefix%!}"
            local body_lower="${body,,}"
            if [[ "$type" == "style" && "$body_lower" != *"code style"* ]]; then
              echo "::error::$source uses the 'style' type but its body does not contain the phrase 'code style' (case-insensitive)."
              echo "Use style only for code style changes such as formatting or whitespace; use feat, fix, refactor, or docs for other changes."
              return 1
            fi
          }

          is_dependabot_author() {
            local author_name="$1"
            local author_email="$2"
            [[ "$author_name" == "dependabot[bot]" || "$author_email" == *"dependabot[bot]@users.noreply.github.com" ]]
          }

          failed=false

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
              echo "Dependabot PR: keeping the bot's dependency title and commit convention."
              exit 0
            fi

            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

            while IFS= read -r commit; do
              subject="$(git show -s --format=%s "$commit")"
              body="$(git show -s --format=%b "$commit")"
              if ! validate_subject "$subject" "Commit $commit" "$body"; then
                failed=true
              fi
            done < <(git rev-list --no-merges "$range")

            if ! validate_subject "$PR_TITLE" "Pull request title" "$PR_BODY"; then
              failed=true
            fi
          else
            before="${{ github.event.before }}"
            head="${{ github.sha }}"

            if [[ "$before" =~ ^0+$ ]]; then
              git fetch origin "$DEFAULT_BRANCH" --no-tags
              base="$(git merge-base "$head" "origin/$DEFAULT_BRANCH")"
              range="$base..$head"
            else
              range="$before..$head"
            fi

            while IFS= read -r commit; do
              author_name="$(git show -s --format=%an "$commit")"
              author_email="$(git show -s --format=%ae "$commit")"
              if is_dependabot_author "$author_name" "$author_email"; then
                echo "Dependabot commit: keeping the bot's dependency commit convention."
                continue
              fi

              subject="$(git show -s --format=%s "$commit")"
              body="$(git show -s --format=%b "$commit")"
              if ! validate_subject "$subject" "Commit $commit" "$body"; then
                failed=true
              fi
            done < <(git rev-list --no-merges "$range")
          fi

          if [[ "$failed" == "true" ]]; then
            exit 1
          fi

  check:
    name: Check
    needs: commit-policy
    if: >-
      always() &&
      (needs.commit-policy.result == 'success' || needs.commit-policy.result == 'skipped') &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.action != 'edited') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11.10.0
          runtime: node@26

      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Check Astro, TypeScript, formatting and linting
        run: |
          status=0
          pnpm check:astro &
          astro_pid=$!
          pnpm lint &
          lint_pid=$!
          wait "$astro_pid" || status=$?
          wait "$lint_pid" || status=$?
          exit "$status"

      - name: Validate migrations and build static site
        run: |
          status=0
          pnpm db:migrate:local &
          migration_pid=$!
          pnpm build &
          build_pid=$!
          wait "$migration_pid" || status=$?
          wait "$build_pid" || status=$?
          exit "$status"

      - name: Validate Workers deployment config
        run: pnpm exec wrangler deploy --dry-run

      - name: Verify browser survey integration
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:feedback
